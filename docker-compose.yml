services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tp-docker/frontend:1.0-dev
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      - NODE_ENV=development
      - CI=false
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tp-docker/backend:1.0-dev
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      - APP_ENV=dev
      - APP_SECRET=change_me_in_production_please
      - PHP_FPM_MAX_CHILDREN=15
      - PHP_MEMORY_LIMIT=256M
    volumes:
      - symfony_code:/var/www/html
    expose:
      - "9000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./ngnix
      dockerfile: Dockerfile
    image: tp-docker/nginx:1.0
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
    ports:
      - "8080:80"
    volumes:
      - react_build:/usr/share/nginx/html:ro
      - symfony_code:/var/www/html:ro
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  react_build:
    driver: local
  symfony_code:
    driver: local

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
