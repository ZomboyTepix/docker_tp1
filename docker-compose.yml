services:
  frontend:
    build:
      context: ./frontend
      target: development
    image: tp-docker/frontend:1.0-dev
    cpus: "${FRONTEND_CPUS:-1.5}"
    mem_limit: "${FRONTEND_MEMORY:-1024M}"
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: tp-docker/backend:1.0-dev
    cpus: "${BACKEND_CPUS:-1.5}"
    mem_limit: "${BACKEND_MEMORY:-512M}"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      APP_SECRET: "${APP_SECRET:?Créer .env depuis .env.example et définir APP_SECRET}"
      DEFAULT_URI: "${DEFAULT_URI:-http://127.0.0.1:${HTTP_PORT:-8080}}"
      PHP_FPM_MAX_CHILDREN: "${PHP_FPM_MAX_CHILDREN:-2}"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-128M}"
    expose:
      - "9000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./ngnix
    image: tp-docker/nginx:1.0
    cpus: "${NGINX_CPUS:-0.25}"
    mem_limit: "${NGINX_MEMORY:-64M}"
    environment:
      NGINX_WORKER_PROCESSES: "${NGINX_WORKER_PROCESSES:-1}"
      NGINX_WORKER_CONNECTIONS: "${NGINX_WORKER_CONNECTIONS:-1024}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: unless-stopped

  frontend-deps:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: tooling
    image: tp-docker/frontend-tooling:1.0-dev
    cpus: "${FRONTEND_CPUS:-1.5}"
    mem_limit: "${FRONTEND_MEMORY:-1024M}"
    init: true
    volumes:
      - ./frontend:/app
    networks:
      - app_network
    command:
      - sh
      - -ec
      - |
        node --version
        npm --version
        npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        exec npm ci --dry-run --ignore-scripts --no-audit --no-fund
    stop_signal: SIGTERM
    stop_grace_period: 10s
    restart: "no"

networks:
  app_network:
    driver: bridge
