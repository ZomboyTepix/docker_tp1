# default.conf – Virtual host Nginx pour le TP Docker
#
# Ce fichier configure le reverse proxy Nginx :
#   - Route /          → sert le frontend React (statiques)
#   - Route /api/      → transfère les requêtes à PHP-FPM (Symfony)
#
# Architecture :
#   Client → Nginx (port 80) → [/]      → fichiers statiques React
#                             → [/api/] → PHP-FPM backend (port 9000)

server {
    # Port d'écoute : 80 (HTTP)
    listen 80;
    listen [::]:80;

    # Nom du serveur (accepte toutes les requêtes)
    server_name _;

    # Répertoire racine : fichiers statiques du frontend React
    root /usr/share/nginx/html;
    index index.html;

    # ── Route principale : Frontend React ──────────────────────
    # try_files : cherche d'abord le fichier exact, puis le dossier,
    # puis renvoie index.html → nécessaire pour React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Route API : Backend Symfony via PHP-FPM ─────────────────
    # Toutes les requêtes vers /api/* sont transmises à PHP-FPM
    location ~ ^/api/ {
        # Répertoire du code PHP (point d'entrée Symfony)
        root /var/www/html/public;
        index index.php;

        # Réécriture vers index.php de Symfony
        # Le routeur Symfony se charge ensuite de dispatcher la requête
        try_files $uri /index.php$is_args$args;
    }

    # ── Traitement des fichiers PHP par PHP-FPM ─────────────────
    location ~ \.php$ {
        root /var/www/html/public;

        # fastcgi_pass : adresse du service PHP-FPM
        # "backend" = nom du service dans docker-compose
        # 9000      = port TCP par défaut de PHP-FPM
        fastcgi_pass backend:9000;

        # Index PHP par défaut
        fastcgi_index index.php;

        # Variables FastCGI standard
        # SCRIPT_FILENAME : chemin absolu du fichier PHP à exécuter
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Inclusion des paramètres FastCGI standard
        include fastcgi_params;

        # Timeout pour les requêtes PHP (en secondes)
        fastcgi_read_timeout 300;
    }

    # ── Optimisation du cache navigateur pour les assets ────────
    # Les fichiers statiques React (hashés) peuvent être mis en cache longtemps
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Page d'erreur personnalisée ──────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
