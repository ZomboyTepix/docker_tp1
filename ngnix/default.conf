# default.conf – Virtual host Nginx pour le TP Docker (mode développement)
#
# Architecture :
#   Client → Nginx (port 80) → [/api/*]  → PHP-FPM Symfony (port 9000)
#                             → [tout le reste] → React Dev Server (port 3000)
#
# En mode dev, React Dev Server sert TOUS les assets (HTML, JS, CSS, HMR).
# Nginx ne sert aucun fichier statique lui-même.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Route API : Backend Symfony via PHP-FPM ─────────────────────
    # DOIT être déclaré en premier (location plus précise)
    location ~ ^/api/ {
        root /var/www/html/public;
        index index.php;
        try_files $uri /index.php$is_args$args;
    }

    # ── PHP-FPM : traitement des fichiers .php ───────────────────────
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── HMR WebSocket (Hot Module Replacement React) ─────────────────
    # Le dev server Webpack utilise /sockjs-node/ ou /__webpack_hmr
    location /sockjs-node/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # ── Tout le reste → React Dev Server ────────────────────────────
    # Inclut : /, /static/js/bundle.js, /static/css/*.css, etc.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # Désactiver le cache pour le mode dev
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ── Pages d'erreur ───────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
