# nginx.conf – Configuration principale Nginx pour le TP Docker
#
# Ce fichier remplace la configuration par défaut de Nginx.
# Il définit les paramètres globaux et inclut les virtual hosts.

# Nombre de processus worker Nginx
# "auto" = un worker par CPU disponible → optimisation automatique
worker_processes auto;

# Niveau de log des erreurs
# Options : debug, info, notice, warn, error, crit, alert, emerg
# "warn" est un bon compromis prod (pas trop verbeux)
error_log /var/log/nginx/error.log warn;

# Fichier PID du processus principal Nginx
pid /var/run/nginx.pid;

events {
    # Nombre maximum de connexions simultanées par worker
    # 1024 est une valeur raisonnable pour un environnement Docker de dev/TP
    # En production on monterait à 4096+
    worker_connections 1024;
}

http {
    # Inclusion des types MIME standards
    # → permet à Nginx de servir le bon Content-Type selon l'extension du fichier
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format des logs d'accès personnalisé
    # Inclut : IP, date, méthode, URL, statut, taille, referrer, user-agent
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # sendfile : transfert de fichiers via appel système kernel (zero-copy)
    # → plus performant que read() + write() pour les fichiers statiques
    sendfile on;

    # tcp_nopush : envoie les headers HTTP en un seul paquet TCP
    # (optimisation réseau, réduit le nombre de paquets)
    tcp_nopush on;

    # Durée de maintien des connexions keep-alive
    # 65 secondes = valeur recommandée pour les navigateurs modernes
    keepalive_timeout 65;

    # Activation de la compression gzip
    # → réduit le poids des réponses HTTP (HTML, CSS, JS, JSON)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Inclusion des virtual hosts (fichiers dans conf.d/)
    include /etc/nginx/conf.d/*.conf;
}
